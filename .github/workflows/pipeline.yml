name: Pipeline de données mensuel

on:
  schedule:
    # Exécuter le 1er du mois à minuit UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Permettre l'exécution manuelle

jobs:
  generate-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Installation des dépendances
        run: npm ci

      - name: Installation de Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Configuration des variables d'environnement
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENCRITIC_API_KEY: ${{ secrets.OPENCRITIC_API_KEY }}
        run: |
          echo "Variables d'environnement configurées"
          
      - name: Diagnostic pré-exécution
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== tsx version ==="
          npx tsx --version
          echo "=== Playwright chromium path ==="
          node -e 'try{var c=require("playwright").chromium;var p=c.executablePath();var e=require("fs").existsSync(p);console.log("path:",p,"exists:",e)}catch(ex){console.error("ERR:",ex.message)}'
          echo "=== Test import cheerio ==="
          node -e "require('cheerio'); console.log('cheerio OK')" || echo "cheerio MANQUANT"
          echo "=== Test tsx script (5s max) ==="
          timeout 5 npx tsx scripts/generate-data.ts 2>&1 | head -40 || true
          echo "=== Fin diagnostic ==="

      - name: Génération des données
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENCRITIC_API_KEY: ${{ secrets.OPENCRITIC_API_KEY }}
        run: |
          set +e
          npm run generate-data 2>&1
          EXIT_CODE=$?
          set -e
          echo "=== Exit code: $EXIT_CODE ==="
          exit $EXIT_CODE
        
      - name: Vérification des fichiers générés
        run: |
          ls -la public/data/
          echo "Contenu du fichier le plus récent:"
          ls -t public/data/*.json | head -1 | xargs cat | head -20
          
      - name: Commit et push des données
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Mise à jour des données - $(date -u +'%Y-%m-%d')" && git push)


